<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f8c"><meta name="description" content="每日重大事件的視覺化解說與互動學習"><title>每日重大事件說</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg"><link rel="stylesheet" href="style.css"><script defer src="config.js?v=2"></script><script defer src="app.js?v=2"></script></head>
<body><a class="skip" href="#library">跳至事件清單</a><header><a class="brand" href="./"><span>◉</span> <span data-i="brand">每日重大事件說</span></a><button id="settingsOpen" data-i="settings">⚙️ 顯示與操作設定</button></header>
<main id="shell"><section class="hero"><div><p class="eyebrow">DAILY WORLD · EXPLAINED</p><h1 data-i="hero">每天一點時間，<br>看懂世界的變化。</h1><p data-i="intro">從事件背景到關鍵影響，以互動簡報探索每日重大事件。</p><a class="primary" href="#library" data-i="browse">探索事件 ↓</a></div><svg viewBox="0 0 460 310" role="img" aria-label="世界事件示意圖"><defs><linearGradient id="g"><stop stop-color="#26beb1"/><stop offset="1" stop-color="#1876b9"/></linearGradient></defs><circle cx="240" cy="150" r="120" fill="url(#g)"/><g fill="none" stroke="#c2fff0" stroke-width="2" opacity=".6"><ellipse cx="240" cy="150" rx="60" ry="120"/><ellipse cx="240" cy="150" rx="120" ry="45"/><path d="M120 150h240M240 30v240"/></g><g fill="#ffe29a"><path d="m160 75 55-15 25 40-35 32-25-15zM257 153l53 5 20 40-45 40-15-35z"/></g><g class="float"><rect x="20" y="75" width="135" height="65" rx="18" fill="#fff"/><text x="40" y="115" font-size="27" fill="#087f8c">▶ WORLD</text></g><g class="float"><rect x="295" y="220" width="150" height="60" rx="18" fill="#ffdc87"/><text x="315" y="260" font-size="25" fill="#384254">✦ EXPLORE</text></g></svg></section>
<section id="library"><div class="sectionHead"><div><p class="eyebrow">THE DAILY COLLECTION</p><h2 data-i="library">事件解說庫</h2></div><button id="refresh" data-i="refresh">↻ 更新清單</button></div><p id="status" role="status" aria-live="polite"></p><div class="toolbar"><label><span data-i="search">搜尋事件</span><input id="search" type="search" placeholder="輸入主題或日期…"></label><label><span data-i="from">起始日期</span><input id="from" type="date"></label><label><span data-i="to">結束日期</span><input id="to" type="date"></label><label><span data-i="sort">排列</span><select id="sort"><option value="new" data-i="new">日期由近到遠</option><option value="old" data-i="old">日期由遠到近</option></select></label><button id="reset" data-i="reset">清除篩選</button></div><div class="tabs"><button id="all" aria-pressed="true" data-i="all">全部事件</button><button id="favorites" aria-pressed="false" data-i="favorites">★ 我的收藏</button><span id="count"></span></div><div id="cards" class="cards"></div></section></main>
<footer><p data-i="footer">每日重大事件說 · 保留原始教材，讓理解從這裡開始。</p><p data-i="offlineNote">可離線開啟首頁；教材播放需要網路，原始教材的圖片、語音依其設定提供。</p><button id="install" hidden data-i="install">＋ 安裝到裝置</button></footer>
<dialog id="settings"><div class="dialogHead"><h2 data-i="settings">⚙️ 顯示與操作設定</h2><button id="settingsClose" aria-label="關閉 / Close">✕</button></div><div class="settingRows"><label><span data-i="fullscreen">全螢幕</span><button id="fullscreen" data-i="toggleFull">開啟／關閉</button></label><label><span data-i="sound">音效</span><select id="sound"><option value="off" data-i="off">關閉</option><option value="on" data-i="on">開啟</option></select></label><label><span data-i="device">裝置</span><select id="device"><option value="auto" data-i="auto">自動</option><option value="phone" data-i="phone">手機</option><option value="tablet" data-i="tablet">平板</option><option value="desktop" data-i="desktop">電腦</option></select></label><label><span data-i="layout">版面</span><select id="layout"><option value="auto" data-i="auto">自動</option><option value="portrait" data-i="portrait">直式</option><option value="landscape" data-i="landscape">橫式</option></select></label><label><span data-i="language">語言</span><select id="language"><option value="zh">繁體中文</option><option value="en">English</option></select></label><label><span data-i="font">字體</span><select id="font"><option value="small" data-i="small">縮小</option><option value="normal" data-i="normal">標準</option><option value="large" data-i="large">放大</option></select></label><label><span data-i="theme">色系</span><select id="theme"><option value="auto" data-i="system">跟隨系統</option><option value="light" data-i="light">亮色</option><option value="dark" data-i="dark">暗色</option></select></label></div><p data-i="settingsNote">設定會保存在此裝置。語言、字體、色系與音效作用於網站介面；原始教材保留自己的控制。</p></dialog>
<dialog id="player"><div class="dialogHead"><h2 id="playerTitle"></h2><button id="playerClose" data-i="close">關閉 ✕</button></div><p id="playerHint" role="status" data-i="hint">正在載入原始教材；若旁白未開始，請點教材內的「開始播放」。</p><iframe id="frame" title="事件解說播放器" sandbox="allow-scripts allow-modals allow-popups" allow="autoplay; fullscreen" allowfullscreen></iframe><div class="playerFoot"><button id="retry" data-i="retry">重新載入</button><a id="source" target="_blank" rel="noopener" data-i="source">Google Drive 原檔 ↗</a></div></dialog>
</body></html>
